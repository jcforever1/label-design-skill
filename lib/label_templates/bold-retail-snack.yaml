# Label Template: Bold Retail Snack
# For snack foods, chips, crackers, and everyday food products
# Style: High contrast, shelf-impact, retail-friendly

name: bold-retail-snack
description: Bold retail snack label for chips, crackers, and everyday snacks. High contrast, shelf-impact, retail-friendly.
industry: food_beverage
recommended_regions: [US_FDA]

design_tokens:
  color_palette:
    primary: "#E63946"        # Bold red
    secondary: "#FFFFFF"       # White
    accent: "#1D3557"        # Navy for contrast
    text_dark: "#1A1A1A"
    text_light: "#FFFFFF"
    background: "#FFFFFF"

  typography:
    brand_name:
      font_family: "Bebas Neue"
      weight: 400
      size: 28
      tracking: 0.05em
      style: "uppercase"
    product_name:
      font_family: "Bebas Neue"
      weight: 400
      size: 22
      style: "uppercase"
    tagline:
      font_family: "Open Sans"
      weight: 600
      size: 9
      tracking: 0.1em
      style: "uppercase"
    body:
      font_family: "Open Sans"
      weight: 400
      size: 7.5
      line_height: 1.4

  spacing:
    base_unit: 4
    section_gap: 12
    inner_padding: 8
    safe_zone: 6

  border:
    style: "thick-block"
    accent_line: false

micrographics:
  level: none
  permitted: []
  prohibited_zones: [all]

layout:
  structure:
    - zone: brand-zone
      position: top-left
      width: 50%
    - zone: hero-visual
      position: top-right
      width: 48%
    - zone: product-name
      position: center-wide
      height: auto
    - zone: regulatory-text
      position: bottom
      height: auto

compliance:
  allergen_highlight: bold
  allergen_format: "Contains: {list}"
  nutrition_declaration: required_if_health_claim
  retail_weight_display: required