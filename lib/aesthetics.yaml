      - "Variable color band"
      - "Flavor icon system"
      - "SKU code zone"
      - "Reusable grid"
      - "Consistent nutrition placement"
      - "Variant-specific illustration"
    prompt_block: "Create a modular product label system that can scale across multiple SKUs. Define fixed zones for brand, product name, legal copy, barcode, and nutrition facts, while allowing flexible zones for flavor, color, imagery, scent, strength, or formula variation."

