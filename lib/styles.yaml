    best_for: ["high-end spirits", "luxury cosmetics", "premium chocolate", "fine jewelry packaging"]
    color_palette:
      - deep_navy
      - gold_foil
      - cream
      - burgundy
    typography:
      primary: "Didot / Bodoni / Times New Roman — Thin to Light weights"
      secondary: "Futura / Avant Garde"
    ai_prompt_block: |
      Luxury premium product label, gold foil stamping, embossed text effect,
      deep navy background, serif typography with generous letter-spacing,
      elegant and opulent, minimal layout with maximum impact,
      foil stamping, debossing, rich color palette, editorial photography style,
      professional print quality, 300 DPI
    negative_prompt_block: |
      Cheap, discount, bright colors, playful, cartoonish, busy, cluttered,
      pastel colors, rounded fonts, comic style

