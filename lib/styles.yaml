# Label Design Style Library — 25 Styles
# Each style: id, name, visual_character, best_for, color_palette, typography, ai_prompt_block, negative_prompt_block

styles:
  - id: modern-minimalist
    name: "Modern Minimalist"
    visual_character: "Clean white space, strong typographic hierarchy, deliberate asymmetry. No decorative clutter — every element earns its place. High contrast with precise alignment."
    best_for: ["premium products", "organic foods", "clean beauty", "tech accessories"]
    color_palette:
      - white
      - charcoal
      - soft_gray
      - single_accent_color
    typography:
      primary: "Helvetica Neue / Inter / SF Pro — Light to Bold weight variation"
      secondary: "Akzidenz Grotesk / Univers"
    ai_prompt_block: |
      Clean minimalist product label design, white background, subtle typographic hierarchy,
      asymmetric layout with generous white space, precise alignment, monochromatic palette
      with single accent, geometric sans-serif typography, no decorative elements,
      professional print quality, 300 DPI
    negative_prompt_block: |
      Cluttered, ornate, vintage, skeuomorphic, busy patterns, multiple colors,
      decorative borders, drop shadows, gradients, busy background

  - id: luxury-premium
