# Label Design Templates — 6 Built-in Reusable Specs
# These are starting points, not final designs. All fields can be overridden.

templates:
  - id: premium-beverage
    name: "Premium Beverage"
    description: "Minimalist label for premium bottled drinks — water, sparkling water, kombucha"
    category: beverage
    style: modern-minimalist
    aesthetic:
      typography_mood: Clean Sans
      color_strategy: Monochromatic
      material_cue: Matte Paper
      layout_principle: Center-Weighted
      micrographics: None
    label:
      type: product
      dimensions:
        width: 4
        height: 3
        unit: inches
      bleed: 0.125
      safe_zone: 0.25
    content:
      front:
        brand_zone: top-center
        product_name: center
        net_volume: bottom-left
        barcode_zone: bottom-right
      back:
        nutrition_panel: full-width
        ingredients: below nutrition
        barcode: bottom-right
    color_palette:
      primary: "#1E3A5F"
      secondary: "#7FB3D3"
      accent: "#E8F4F8"
      text_dark: "#1A1A1A"
      text_light: "#FFFFFF"

